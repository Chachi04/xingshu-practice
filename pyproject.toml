[project]
name = "xingshu-practice"
version = "0.1.0"
description = "A practice tool for Chinese Xingshu calligraphy."
readme = "README.md"
authors = [{ name = "Chachi", email = "w.jiaqi004@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pymupdf>=1.28.2",
    "pypinyin>=0.55.0",
    "textual>=8.2.8",
    "textual-image>=0.14.0",
]

[project.scripts]
search = "search.cli:main"
split_chars = "split_chars:main"
practice = "practice.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["search", "split_chars", "practice"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
